[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

monitor_port = COM7
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder

upload_speed = 921600

board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -O2
    -Wno-deprecated-declarations
    -Wno-cpp